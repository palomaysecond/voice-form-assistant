<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Form Assistant</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e3e2dc;
          --accent:#2f5bd3; --warn:#b4540a; --warn-bg:#fdf1e4; --ok:#1f7a4a; --ok-bg:#e8f5ee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151514; --card:#1f1f1d; --ink:#ecebe6; --muted:#a3a29b; --line:#34332f;
            --accent:#7c9cff; --warn:#f0a35e; --warn-bg:#3a2a1a; --ok:#6fcf97; --ok-bg:#16301f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:20px; margin-bottom:16px; }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  label { font-weight:600; font-size:.9rem; }
  button, select, input[type=file] { font:inherit; }
  button { border:1px solid var(--accent); background:var(--accent); color:#fff;
           padding:8px 16px; border-radius:8px; cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  select { padding:7px 10px; border-radius:8px; border:1px solid var(--line);
           background:var(--card); color:var(--ink); }
  .rec { background:#c0392b; border-color:#c0392b; }
  #status { color:var(--muted); min-height:1.5em; margin-top:12px; }
  #status.err { color:#c0392b; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:.8rem; color:var(--muted); font-weight:600; text-transform:uppercase; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:.8rem; }
  .pill.ok { background:var(--ok-bg); color:var(--ok); }
  .pill.warn { background:var(--warn-bg); color:var(--warn); }
  .muted { color:var(--muted); font-size:.9rem; }
  .say { font-size:1.05rem; }
  audio { width:100%; margin-top:8px; }
  #result { display:none; }
  code { font-size:.85rem; }
</style>
</head>
<body>
<main>
  <h1>Voice Form Assistant</h1>
  <p class="sub">Say your name, the date you need, and what you need (refund, repair, appointment, account change or complaint). The assistant fills the form and reads it back.</p>

  <div class="card">
    <div class="row">
      <button id="recBtn" type="button">● Record</button>
      <span class="muted">or</span>
      <input id="file" type="file" accept=".wav,.mp3,.webm,.ogg,.m4a,audio/*">
    </div>
    <div class="row" style="margin-top:16px">
      <label for="voice">Read-back voice</label>
      <select id="voice"></select>
      <button id="sendBtn" type="button" disabled>Fill the form</button>
    </div>
    <div id="status"></div>
  </div>

  <div id="result">
    <div class="card">
      <p class="say" id="confirmation"></p>
      <audio id="player" controls></audio>
      <p class="muted" id="summary"></p>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Field</th><th>Value</th><th>Confidence</th><th>Status</th></tr></thead>
        <tbody id="fields"></tbody>
      </table>
      <p class="muted" id="metric"></p>
    </div>
    <div class="card">
      <p><strong>Transcript</strong> <span class="muted" id="sttconf"></span></p>
      <p id="transcript"></p>
      <p class="muted" id="timings"></p>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let audioBlob = null, audioName = null, recorder = null, chunks = [];

function setStatus(msg, isErr = false) {
  $("status").textContent = msg;
  $("status").className = isErr ? "err" : "";
}

fetch("voices").then(r => r.json()).then(voices => {
  for (const v of voices) {
    const o = document.createElement("option");
    o.value = v.key; o.textContent = v.label;
    if (v.key === "casual") o.selected = true;
    $("voice").appendChild(o);
  }
}).catch(() => setStatus("Could not load voices.", true));

$("file").addEventListener("change", (e) => {
  const f = e.target.files[0];
  if (!f) return;
  audioBlob = f; audioName = f.name;
  $("sendBtn").disabled = false;
  setStatus(`Selected ${f.name}`);
});

function extFor(mime) {
  if (mime.includes("webm")) return "webm";
  if (mime.includes("ogg")) return "ogg";
  if (mime.includes("mp4") || mime.includes("aac")) return "m4a";
  return "webm";
}

$("recBtn").addEventListener("click", async () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    setStatus("Recording needs HTTPS and a browser with MediaRecorder.", true); return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(stream);
    chunks = [];
    recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const mime = recorder.mimeType || "audio/webm";
      audioBlob = new Blob(chunks, { type: mime });
      audioName = `recording.${extFor(mime)}`;
      $("recBtn").textContent = "● Record"; $("recBtn").classList.remove("rec");
      $("sendBtn").disabled = false;
      setStatus(`Recorded ${(audioBlob.size / 1024).toFixed(0)} KB. Click "Fill the form".`);
    };
    recorder.start();
    $("recBtn").textContent = "■ Stop"; $("recBtn").classList.add("rec");
    setStatus("Recording… speak now, then click Stop.");
  } catch (err) {
    setStatus("Microphone permission was denied.", true);
  }
});

function pct(x) { return x == null ? "—" : Math.round(x * 100) + "%"; }

$("sendBtn").addEventListener("click", async () => {
  if (!audioBlob) return;
  const fd = new FormData();
  fd.append("audio", audioBlob, audioName);
  fd.append("voice", $("voice").value);
  $("sendBtn").disabled = true;
  setStatus("Transcribing, analyzing and synthesizing… (the first request after a cold start can take ~30 s)");
  try {
    const r = await fetch("process", { method: "POST", body: fd });
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
    render(body);
    setStatus("Done.");
  } catch (err) {
    setStatus("Error: " + err.message, true);
  } finally {
    $("sendBtn").disabled = false;
  }
});

function render(b) {
  $("result").style.display = "block";
  $("confirmation").textContent = b.confirmation_text;
  $("summary").textContent = b.summary_text.slice(b.confirmation_text.length).trim();
  $("player").src = "data:audio/mp3;base64," + b.audio.audio_base64;
  $("player").play().catch(() => {});

  const tbody = $("fields"); tbody.innerHTML = "";
  for (const name of ["name", "date", "request_type"]) {
    const f = b.fields[name];
    const tr = document.createElement("tr");
    const cells = [name.replace("_", " ")];
    let status;
    if (!f) { cells.push("—", "—"); status = '<span class="pill warn">missing</span>'; }
    else {
      cells.push(f.value, pct(f.confidence));
      status = b.low_confidence_fields.includes(name)
        ? '<span class="pill warn">please confirm</span>' : '<span class="pill ok">ok</span>';
    }
    cells.forEach(c => { const td = document.createElement("td"); td.textContent = c; tr.appendChild(td); });
    const td = document.createElement("td"); td.innerHTML = status; tr.appendChild(td);
    tbody.appendChild(tr);
  }
  $("metric").textContent = `fields_correct_first_try = ${b.fields_correct_first_try}`;
  $("transcript").textContent = b.transcript;
  $("sttconf").textContent = `(STT confidence ${pct(b.confidence)}, ${b.duration_seconds}s audio)`;
  const t = b.timings_ms;
  $("timings").textContent = `Speech-to-text ${t.stt_ms} ms · Language ${t.language_ms} ms · TTS ${t.tts_ms} ms · voice ${b.audio.voice_name}`;
}
</script>
</body>
</html>
